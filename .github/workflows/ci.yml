name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Unit and integration tests
        run: uv run pytest tests/unit tests/integration

      - name: End-to-end tests
        run: uv run pytest tests/e2e

  frontend:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

  house-rules:
    name: House rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No em dashes
        run: |
          # AGENT.md forbids the em dash and en dash characters anywhere in the repo.
          if grep -rInP '\x{2014}|\x{2013}' --exclude-dir=.git .; then
            echo "::error::Found an em dash or en dash. Use a plain dash '-' instead. See AGENT.md."
            exit 1
          fi
          echo "No em dashes found."

      - name: No AI co-author trailers
        run: |
          # AGENT.md forbids AI attribution in commit messages.
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if [ -z "$base" ]; then
            echo "Not a pull request, skipping."
            exit 0
          fi
          if git log --format='%B' "$base..$head" | grep -inE 'co-authored-by:.*(claude|copilot|cursor|codex|bot)|generated with'; then
            echo "::error::Commit message contains AI attribution. See AGENT.md."
            exit 1
          fi
          echo "Commit messages are clean."
[project]
name = "reefcommand"
version = "0.1.0"
description = "Decision support and resource allocation for coral reef response planning."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "ortools>=9.11",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "anthropic>=0.39",
]

[project.optional-dependencies]
data = [
    "pandas>=2.2",
    "xarray>=2024.9",
    "netcdf4>=1.7",
    "shapely>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reefcommand"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle, pyflakes
    "I",                 # isort
    "N",                 # pep8-naming
    "UP",                # pyupgrade
    "B",                 # bugbear
    "A",                 # builtins shadowing
    "C4",                # comprehensions
    "SIM",               # simplify
    "RUF",               # ruff-specific
    "ANN",               # annotations
    "PT",                # pytest style
]
ignore = [
    "ANN401",  # allow typing.Any where it is genuinely the right type
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["reefcommand"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
    "e2e: end-to-end test driving the real entry point",
    "external: requires a live external service, skipped by default",
]
filterwarnings = ["error"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["reefcommand"]

[tool.coverage.run]
source = ["src/reefcommand"]
branch = true

# Structured form of every demo field report, keyed by report_id.
#
# This is the "structuring fixtures" half of DATA-06. The data lane does not run
# an LLM in ingestion, so the OBSERVE to STRUCTURE step for the demo is a
# deterministic lookup: field_reports.structure(report) returns the record here
# whose report_id matches. Because the reports were reconstructed from published
# observations, the structured values are known rather than guessed.
#
# Absence of a field means "not reported", never "reported as zero". Anything the
# reconstruction was unsure about is written into extraction_notes rather than
# invented as a number.


# Site records for the seven NOAA Mission: Iconic Reefs study sites.
#
# Replaces the placeholder iconic_reefs.yaml. Every value is externally sourced
# except restoration_investment, which is not published anywhere and is simulated.
#
# A site's values do not share an origin, so each block carries its own provenance:
#
#   record-level    study-area membership, from Mission: Iconic Reefs
#   location        codified sanctuary boundaries, or FKNMS mooring buoys
#   measurements    FWC CREMP where the site is named, NOAA NCRMP otherwise
#   restoration_investment   simulated, with the required note
#
# THE TWO MONITORING PROGRAMMES ARE NOT INTERCHANGEABLE.
# CREMP cover includes Millepora, a hydrocoral, and an unidentified Scleractinia
# bin. The NCRMP figures here exclude Millepora. Because score_sites normalizes
# across the seven sites, a systematic difference between programmes becomes a
# systematic difference in site value. sampling.program is a required field for
# this reason and must reach the dashboard next to the value.
#
# Sample size and spread are first-class fields rather than prose, so a consumer
# can see that Horseshoe rests on five sample units and Cheeca Rocks on 27,
# without this fixture imposing a confidence weight of its own.

metadata:
  schema_version: 1
  fixture_id: iconic_reefs
  description: The seven Mission Iconic Reefs study sites, with per-block provenance.
  created_at: 2026-08-17T21:52:13Z

records:
  - record_id: carysfort
    data:
      site_id: carysfort
      name: Carysfort Reef
      has_active_restoration: true
      location:
        latitude: 25.21762
        longitude: -80.21468
        location_basis: spa_polygon_area_centroid
        zone_name_in_source: Carysfort/South Carysfort Reef
        zone_span_km: 3.88
        provenance:
          kind: cache
          source: 15 CFR Part 922 Subpart P Appendix V, Sanctuary Preservation Areas Boundary Coordinates
          source_url: https://www.govinfo.gov/content/pkg/CFR-2022-title15-vol3/xml/CFR-2022-title15-vol3-part922-subpartP-appV.xml
          fetched_at: 2026-08-17T21:52:13Z
          note: >
            Area centroid of the four codified vertices. The CFR zone bundles Carysfort and South
            Carysfort into one polygon, so the centroid falls between the two reefs rather than on the
            Carysfort spur-and-groove proper. Cross-checked against Kelly et al. 2024, which publishes
            25.2209, -80.2102, 0.4 km away.
      measurements:
        coral_cover_pct: 2.66
        species_richness: 10
        sampling:
          program: CREMP
          sampling_design: fixed permanently staked transects, photo point counts, four stations per sub-site
          reference_years: [2023]
          sample_n: 8
          sample_unit: station
          sample_sd_pct: 0.69
          matching_method: named_site_exact
          matching_distance_km: 0.0
          habitat_types: ['offshore_shallow', 'offshore_deep']
          richness_definition: >
            count of distinct stony coral taxa with non-zero cover across the site stations in the
            reference year, excluding Millepora and the unidentified Scleractinia bin
          includes_millepora: true
          station_ids: ['501', '502', '503', '504', '701', '702', '703', '704']
        provenance:
          kind: cache
          source: FWC Coral Reef Evaluation and Monitoring Project, tables 10 and 11
          source_url: https://gis.myfwc.com/hosting/rest/services/Open_Data/Coral_Reef_Evaluation_and_Monitoring_Project_Locations/MapServer
          observed_at: 2023-12-31
          fetched_at: 2026-08-17T21:52:13Z
          note: >
            Named CREMP site, siteid 50 Carysfort Shallow and 70 Carysfort Deep, four stations each.
            Cover is the mean of the eight station values for 2023; station range 1.61 to 3.60 percent.
            Summing the table 10 species columns reproduces the table 11 Stony_coral total per station,
            so the two tables agree.
      restoration_investment:
        value: 0.9
        provenance:
          kind: simulated
          source: ReefCommand demo scenario
          fetched_at: null
          note: >
            SIMULATED. No public dataset publishes per-site restoration spend for Mission Iconic Reefs.
            Invented for the demo and used only in strategic_value. The relative ordering across sites
            is a stated assumption, not a measurement.
    provenance:
      kind: cache
      source: NOAA Mission Iconic Reefs
      source_url: https://missioniconicreefs.org/mission/
      fetched_at: 2026-08-17T21:52:13Z
      note: >
        Study-area membership. All seven sites are named Mission Iconic Reefs restoration sites,
        which is what has_active_restoration records. NOAA confirms the seven are ecologically and
        culturally significant. NOAA does not numerically rank them, and neither does this fixture.


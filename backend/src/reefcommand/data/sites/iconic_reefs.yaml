            for navigation. NOAA describes the feature as a cluster of patch reefs, so this is a
            convention, not a survey point.
      measurements:
        coral_cover_pct: 1.4
        species_richness: 3
        sampling:
          program: NCRMP
          sampling_design: stratified random sample units, linear point intercept
          reference_years: [2022, 2024]
          sample_n: 5
          sample_unit: sample_unit
          sample_sd_pct: 1.14
          matching_method: spatial_buffer_1km_pooled_sample_units
          matching_distance_km: 1.0
          habitat_types: ['patch']
          richness_definition: >
            count of distinct scleractinian cover categories observed in the buffer across the reference
            years, excluding Millepora
          includes_millepora: false
          station_ids: []
        provenance:
          kind: cache
          source: NOAA National Coral Reef Monitoring Program, benthic cover, Florida
          source_url: https://www.ncei.noaa.gov/erddap/tabledap/CRCP_Benthic_Cover_Florida.html
          observed_at: null
          fetched_at: 2026-08-17T21:52:13Z
          note: >
            Not a named site in any dataset. NCRMP sample units carry numeric codes, so this pools the
            five distinct sample units falling inside a 1 km box around the site coordinate, across 2022
            and 2024. Five units is a thin basis; sample_n is a first-class field so a consumer can see
            that without the model imposing a weight.
      restoration_investment:

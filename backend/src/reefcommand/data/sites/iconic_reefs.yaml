# Study area: the seven Florida Keys sites associated with NOAA Mission: Iconic Reefs.
#
# NOAA confirms these sites are ecologically and culturally significant.
# NOAA does NOT numerically rank them from most to least ecologically valuable,
# and neither does this file. Order here is geographic, north to south.
#
# measurements.provenance must be one of: live, cache, simulated, synthetic.
# Where a CREMP station is used, record distance_km, habitat_type, and
# matching_method so a reviewer can disagree with the match. CREMP monitors
# roughly 40 Florida Keys sites and Iconic Reefs covers seven restoration sites;
# they are not a 1:1 mapping. Where no suitable CREMP coverage exists, use another
# cited source or a clearly labeled placeholder. Never substitute silently.
#
# TODO: fill coordinates and measurements from cited sources before the demo.


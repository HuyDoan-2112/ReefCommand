        provenance:
          kind: cache
          source: FKNMS Mooring Buoy Locations
          source_url: https://floridakeys.noaa.gov/mbuoy/allmbuoys.html
          fetched_at: 2026-08-17T21:52:13Z
          note: >
            Not a Sanctuary Preservation Area, so no codified polygon exists. Midpoint of buoys
            Horseshoe Reef 1 at 25 deg 08.313 min N, 80 deg 17.690 min W and Horseshoe Reef 2 at 25 deg

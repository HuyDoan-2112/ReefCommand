# SYNTHETIC. These are NOT real AGRRA reviewed records. The tracking map is not
# scraped, and no permitted export was available in this environment, so this
# file is a clearly labeled placeholder. Every record is provenance synthetic and
# its review_status says synthetic_example, so nothing here can be mistaken for a
# real reviewed submission. Replace this with a real permitted AGRRA export before
# making any real claim about disease proximity.
#
# The placements are loosely based on the documented 2023 post-bleaching disease
# at inshore Florida Keys sites (black band disease and post-bleaching lesions
# reported at Cheeca Rocks, Newfound Harbor, and Sombrero in the 2023 Frontiers
# heatwave study), so the demo behaves plausibly. The last record sits far to the
# north to exercise the radius filter and must fall outside a 25 km search of any
# study site.

